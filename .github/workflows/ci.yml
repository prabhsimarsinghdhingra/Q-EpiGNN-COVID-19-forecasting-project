name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - name: Ruff lint
        run: ruff check src tests
      - name: Ruff format check (informational)
        run: ruff format --check src tests || true

  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install CPU-only PyTorch (small, no CUDA)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run unit tests with coverage
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml --junitxml=junit.xml
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: |
            coverage.xml
            junit.xml

  smoke-train:
    name: end-to-end smoke run
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - name: Train baselines + Q-EpiGNN for 2 epochs on the committed processed data
        run: python src/train.py --models persistence ar_ridge lstm qepignn --seeds 0 --epochs 2 --out ci_smoke.json
      - name: Sanity-check metrics file
        run: |
          python - <<'PY'
          import json, math
          r = json.load(open("results/ci_smoke.json"))
          assert set(r) == {"persistence", "ar_ridge", "lstm", "qepignn"}, r.keys()
          for name, runs in r.items():
              for run in runs.values():
                  for h in ("7", "14", "30"):
                      v = run["metrics"][h]["RMSE"]
                      assert math.isfinite(v) and 0 < v < 100, (name, h, v)
          print("smoke run OK")
          PY
