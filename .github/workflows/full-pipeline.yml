name: Full pipeline (manual)

# Re-creates every result from the public JHU CSSE data: download -> preprocess -> benchmark -> figures.
# Takes roughly 20-40 minutes on a GitHub-hosted runner.
on:
  workflow_dispatch:
    inputs:
      epochs:
        description: "Max epochs per model"
        default: "40"
      seeds:
        description: "Space-separated seeds"
        default: "0 1 2"

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - name: Download JHU CSSE data
        run: ./download_data.sh
      - name: Preprocess
        run: python src/preprocess.py
      - name: Train and evaluate all models
        run: >
          python src/train.py
          --models persistence ar_ridge qepignn lstm gcn_lstm gat_lstm abl_no_amp abl_heat abl_no_walk qepignn_hybrid
          --seeds ${{ inputs.seeds }} --epochs ${{ inputs.epochs }} --out results.json
      - name: Significance tests and conformal intervals
        run: python src/stats.py && python src/uncertainty.py
      - name: Figures and tables
        run: python src/figures.py && python src/figs_extra.py
      - uses: actions/upload-artifact@v4
        with:
          name: qepignn-results
          path: |
            results/results.json
            results/summary.json
            results/significance.json
            results/uncertainty.json
            results/train_log.txt
            figures/
